[Unit]
Wants=hindsight-embedding-gateway.service
After=hindsight-embedding-gateway.service

[Service]
EnvironmentFile=%h/.config/hindsight/embedding-gateway.env
Environment=GOOGLE_GEMINI_BASE_URL=http://127.0.0.1:8890
Environment=HINDSIGHT_API_QUERY_EMBEDDINGS_PROVIDER=google
Environment=HINDSIGHT_API_PASSAGE_EMBEDDINGS_PROVIDER=google
ExecStartPre=/usr/bin/node %h/.local/share/pi-hindsight-embedding-batcher/bootstrap.mjs
